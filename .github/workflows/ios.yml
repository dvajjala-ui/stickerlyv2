name: iOS app

# Builds the shared Kotlin framework and the unsigned StickerDock iPhone app on a macOS runner.
# Nothing is signed, uploaded or deployed; see docs/IOS.md for what needs an Apple account.
# macOS minutes count 10× against private-repo Actions quotas, so Android-only changes don't trigger it.
on:
  push:
    paths: ['app/shared/**', 'app/iosApp/**', 'app/gradle/**', 'app/*.kts', 'app/gradle.properties', '.github/workflows/ios.yml']
  pull_request:
    paths: ['app/shared/**', 'app/iosApp/**', 'app/gradle/**', 'app/*.kts', 'app/gradle.properties', '.github/workflows/ios.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 75
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      # Kotlin 2.4 targets the Xcode 26 SDKs; macos-15 defaults to Xcode 16.4.
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Toolchain
        run: |
          xcodebuild -version
          java -version
          chmod +x gradlew   # committed from Windows without the executable bit
          # app/gradle.properties keeps the daemon at 2 GB for the 8 GB dev PC; Kotlin/Native links the Compose
          # framework inside the Gradle daemon and needs more. The user-level file wins over the project one
          # and also applies to the Gradle call inside xcodebuild.
          mkdir -p ~/.gradle
          echo 'org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8' >> ~/.gradle/gradle.properties

      - name: Link debug framework (simulator)
        run: ./gradlew :shared:linkDebugFrameworkIosSimulatorArm64 --stacktrace

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: app/iosApp
        run: xcodegen generate

      - name: Build app (simulator, unsigned)
        working-directory: app/iosApp
        run: |
          xcodebuild build \
            -project StickerDock.xcodeproj \
            -scheme StickerDock \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            ARCHS=arm64 \
            CODE_SIGNING_ALLOWED=NO

      # Runs even when the app build failed, so both results show up in one run.
      - name: Shared iOS tests (simulator)
        if: ${{ !cancelled() }}
        run: ./gradlew :shared:iosSimulatorArm64Test --stacktrace

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ios-test-reports
          path: |
            app/shared/build/reports/tests/
            app/shared/build/test-results/
          if-no-files-found: ignore
