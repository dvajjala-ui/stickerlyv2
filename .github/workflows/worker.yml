name: Sticker worker

on:
  schedule:
    # Every 30 minutes, offset from :00/:30 when shared runners are busiest.
    - cron: '7,37 * * * *'
  workflow_dispatch:
    inputs:
      stage:
        description: Stage to run
        type: choice
        options: [all, trends, prescreen, analyze, create, compose]
        default: all
      limit:
        description: Max sources per queue stage (blank = defaults)
        required: false
        default: ''
      dry_run:
        description: Read-only run (records planned writes, never spends AI budget)
        type: boolean
        default: false
  push:
    paths: ['backend/worker/**', '.github/workflows/worker.yml']
  pull_request:
    paths: ['backend/worker/**', '.github/workflows/worker.yml']

permissions:
  contents: read

jobs:
  test:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend/worker
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/worker/pyproject.toml
      - name: Install Devanagari shaping library
        run: sudo apt-get install -y --no-install-recommends libfribidi0 || true
      - run: python -m pip install ".[dev]"
      - run: python -m pytest -q

  run:
    # Scheduled runs wait until the owner sets the repository variable WORKER_SCHEDULE=on (Settings → Secrets and
    # variables → Actions → Variables) after adding the Supabase/Groq secrets; manual runs always work.
    if: (github.event_name == 'schedule' && vars.WORKER_SCHEDULE == 'on') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: stickerdock-worker
      cancel-in-progress: false
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      GROQ_API_KEYS: ${{ secrets.GROQ_API_KEYS }}
      # Model ids rotate (preview models); override with repository variables when they do.
      GROQ_VISION_MODEL: ${{ vars.GROQ_VISION_MODEL || 'qwen/qwen3.8-27b' }}
      GROQ_TEXT_MODEL: ${{ vars.GROQ_TEXT_MODEL || 'openai/gpt-oss-120b' }}
      GROQ_SMALL_TEXT_MODEL: ${{ vars.GROQ_SMALL_TEXT_MODEL || 'openai/gpt-oss-20b' }}
      GROQ_SAFETY_MODEL: ${{ vars.GROQ_SAFETY_MODEL || 'openai/gpt-oss-safeguard-20b' }}
      GROQ_VISION_TPM: ${{ vars.GROQ_VISION_TPM || '8000' }}
    defaults:
      run:
        working-directory: backend/worker
    steps:
      - name: Check configuration
        id: config
        working-directory: .
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::notice title=Sticker worker skipped::SUPABASE_URL / SUPABASE_SERVICE_ROLE_KEY secrets are not set; nothing to do."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
          if [ -z "$GROQ_API_KEYS" ]; then
            echo "::notice title=No Groq keys::GROQ_API_KEYS is not set; analyze is skipped and captions fall back to stored ideas."
          fi

      - uses: actions/checkout@v7
        if: steps.config.outputs.ready == 'true'

      - uses: actions/setup-python@v7
        if: steps.config.outputs.ready == 'true'
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/worker/pyproject.toml

      - name: Install worker
        if: steps.config.outputs.ready == 'true'
        run: python -m pip install ".[ocr]"

      - name: Check queue
        id: queue
        if: steps.config.outputs.ready == 'true'
        run: python -m stickerworker pending --github-output

      - name: Install OCR, video and Devanagari shaping libraries
        if: steps.config.outputs.ready == 'true' && steps.queue.outputs.media == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            tesseract-ocr tesseract-ocr-eng tesseract-ocr-hin ffmpeg libfribidi0
          python -c "from PIL import features; print('raqm', features.check_feature('raqm'))"

      - name: Run stages
        if: steps.config.outputs.ready == 'true'
        env:
          STAGE: ${{ inputs.stage || 'all' }}
          LIMIT: ${{ inputs.limit }}
          DRY_RUN: ${{ inputs.dry_run && 'true' || '' }}
        run: |
          args=(run --stage "$STAGE")
          if [ -n "$LIMIT" ]; then args+=(--limit "$LIMIT"); fi
          if [ -n "$DRY_RUN" ]; then args+=(--dry-run --out "$RUNNER_TEMP/worker-out"); fi
          python -m stickerworker "${args[@]}"
