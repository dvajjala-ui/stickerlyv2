name: App

# Shared-module tests (library, WebP, pager, auto tags), the SQLDelight migration check and a debug APK build.
on:
  push:
    paths: ['app/**', '.github/workflows/app.yml']
  pull_request:
    paths: ['app/**', '.github/workflows/app.yml']

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew :shared:jvmTest :shared:verifySqlDelightMigration :androidApp:assembleDebug --console=plain
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: jvm-test-results
          path: app/shared/build/test-results/jvmTest/
