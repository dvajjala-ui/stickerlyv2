[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stickerworker"
version = "0.1.0"
description = "StickerDock v2 AI sticker factory: prescreen, analyze, create, compose and trends stages."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27,<1",
  "pillow>=11.0",
  "imagehash>=4.3",
  "numpy>=1.26",
]

[project.optional-dependencies]
# OCR needs the tesseract binary (apt: tesseract-ocr tesseract-ocr-hin).
ocr = ["pytesseract>=0.3.10"]
# Subject cutout. The worker only ever loads birefnet-general or isnet-general-use,
# never rembg's default (non-commercial) model.
cutout = ["rembg[cpu]>=2.0.60"]
# Applying the Supabase migrations over Postgres (python -m stickerworker migrate).
db = ["psycopg[binary]>=3.2"]
dev = ["pytest>=8"]

[project.scripts]
stickerworker = "stickerworker.cli:main"

[tool.setuptools.packages.find]
include = ["stickerworker*"]

[tool.setuptools.package-data]
stickerworker = ["fonts/*.ttf", "fonts/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "SIM", "I"]

[tool.ruff.lint.per-file-ignores]
"stickerworker/ai/prompts.py" = ["E501"]  # prompt text reads better unwrapped
