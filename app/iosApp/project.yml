# XcodeGen spec for the StickerDock iPhone app. Generate the project with `xcodegen generate` in this
# folder (StickerDock.xcodeproj is not committed). The app is a thin SwiftUI shell around the shared
# Kotlin framework `Shared` (app/shared), which Gradle builds in the pre-build script below.
name: StickerDock
options:
  bundleIdPrefix: app.stickerdock
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: 2.0.0
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    # Gradle writes outside the declared outputs, which Xcode's script sandbox would block.
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    # Optional Discover backend, copied into Info.plist. Leave empty for an offline build; set them with
    # `xcodebuild ... STICKERDOCK_DISCOVER_URL=https://<project>.supabase.co STICKERDOCK_DISCOVER_KEY=<anon key>`
    # or a local, untracked xcconfig. Never commit keys.
    STICKERDOCK_DISCOVER_URL: ""
    STICKERDOCK_DISCOVER_KEY: ""
    STICKERDOCK_APP_STORE_LINK: ""
    STICKERDOCK_PLAY_STORE_LINK: ""
targets:
  StickerDock:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: iosApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.stickerdock
        PRODUCT_NAME: StickerDock
        INFOPLIST_FILE: iosApp/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        TARGETED_DEVICE_FAMILY: "1"
        # The shared framework is built for iosArm64 / iosSimulatorArm64 only (no Intel simulator).
        ARCHS: arm64
        CODE_SIGN_STYLE: Automatic
        # Set your Apple team id here (or in Xcode) to run on a device; CI builds unsigned.
        DEVELOPMENT_TEAM: ""
        FRAMEWORK_SEARCH_PATHS:
          - "$(inherited)"
          - "$(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        # Static Kotlin framework: system libraries it uses (SQLite via SQLDelight, zlib) are linked here.
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-framework"
          - "Shared"
          - "-lsqlite3"
          - "-lz"
    preBuildScripts:
      - name: Compile Kotlin Framework
        basedOnDependencyAnalysis: false
        shell: /bin/sh
        script: |
          if [ "YES" = "$OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED" ]; then
            echo "Skipping Gradle build task invocation due to OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED environment variable set to \"YES\""
            exit 0
          fi
          # Xcode started from the Dock doesn't inherit the shell environment.
          if [ -z "$JAVA_HOME" ] && [ -x /usr/libexec/java_home ]; then
            JAVA_HOME="$(/usr/libexec/java_home -v 21 2>/dev/null || /usr/libexec/java_home 2>/dev/null)"
            export JAVA_HOME
          fi
          if [ -z "$ANDROID_HOME" ] && [ -d "$HOME/Library/Android/sdk" ]; then
            export ANDROID_HOME="$HOME/Library/Android/sdk"
          fi
          cd "$SRCROOT/.."
          /bin/sh ./gradlew :shared:embedAndSignAppleFrameworkForXcode
schemes:
  StickerDock:
    build:
      targets:
        StickerDock: all
    run:
      config: Debug
    archive:
      config: Release
